<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin prihlásenie – Umyj.to</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-obal {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: var(--biela);
      border: 2px solid var(--okraj);
      border-radius: 14px;
      padding: 40px 48px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .login-box h1 {
      font-size: 1.5rem;
      color: var(--modra);
      margin-bottom: 6px;
    }
    .login-box p {
      color: var(--seda);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .login-chyba {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Umyj<span>.to</span></a>
    </div>
  </header>

  <div class="login-obal">
    <div class="login-box">
      <h1>⚙️ Admin prihlásenie</h1>
      <p>Prístup len pre administrátorov</p>

      <div id="chyba" class="login-chyba">Zlé meno alebo heslo.</div>

      <form id="login-form">
        <div class="form-group">
          <label for="meno">Meno</label>
          <input type="text" id="meno" class="form-input" placeholder="admin" required autofocus>
        </div>
        <div class="form-group">
          <label for="heslo">Heslo</label>
          <input type="password" id="heslo" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px">
          Prihlásiť sa
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      let meno  = document.getElementById("meno").value;
      let heslo = document.getElementById("heslo").value;

      let res = await fetch("/api/login", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ meno, heslo })
      });

      if (res.ok) {
        window.location.href = "/admin.html";
      } else {
        document.getElementById("chyba").style.display = "block";
      }
    });
  </script>

</body>
</html>
