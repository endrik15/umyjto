<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe – login.html</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .login-obal { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: var(--biela); border: 2px solid var(--okraj); border-radius: 14px; padding: 40px 48px; width: 100%; max-width: 400px; box-shadow: var(--tien); }
    .login-box h1 { font-size: 1.5rem; color: var(--modra); margin-bottom: 6px; }
    .login-box p { color: var(--seda); font-size: 0.9rem; margin-bottom: 28px; }
    .login-chyba { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; margin-bottom: 16px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Umyj<span>.to</span></a>
    </div>
  </header>

  <div class="login-obal">
    <div class="login-box">

      <h1>Nadpis</h1>
      <p>Popis</p>

      <div id="chyba" class="login-chyba">Chybová hláška</div>

      <form id="login-form">

        <div class="form-group">
          <label for="meno">Meno</label>
          <input type="text" id="meno" class="form-input" placeholder="Meno">
        </div>

        <div class="form-group">
          <label for="heslo">Heslo</label>
          <input type="password" id="heslo" class="form-input" placeholder="Heslo">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px">button</button>

      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Pätička</p>
    </div>
  </footer>

</body>
</html>
